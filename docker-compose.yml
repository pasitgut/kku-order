services:
  mysql:
    image: mysql:8.4
    container_name: docflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: docflow
      MYSQL_USER: docflow
      MYSQL_PASSWORD: docflow
      MYSQL_ROOT_PASSWORD: root-docflow
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - docflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udocflow", "-pdocflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: docflow-api
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      DB_DSN: docflow:docflow@tcp(mysql:3306)/docflow?charset=utf8mb4&parseTime=True&loc=Local
      UPLOAD_DIR: /app/storage
      IMPORT_DIR: /app/incoming
      PORT: 8080
      GIN_MODE: release
      WEB_ORIGIN: http://localhost:3000
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_USER_HEADER: ${AUTH_USER_HEADER:-X-Auth-Request-User}
      AUTH_ROLE_HEADER: ${AUTH_ROLE_HEADER:-X-Auth-Request-Role}
      EXTERNAL_USERS_URL: ${EXTERNAL_USERS_URL:-https://fs.computing.kku.ac.th/api/ext/v1/users}
      USER_SYNC_CRON: ${USER_SYNC_CRON:-0 5 * * *}
      USER_SYNC_TZ: ${USER_SYNC_TZ:-Asia/Bangkok}
      EXPIRY_CRON: ${EXPIRY_CRON:-10 5 * * *}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMPORT_CRON: "${IMPORT_CRON:-*/5 * * * *}"
      OCR_LANGUAGE: ${OCR_LANGUAGE:-thai}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_MAX_SIDE: ${OCR_MAX_SIDE:-1536}
      OCR_PREPROCESS: ${OCR_PREPROCESS:-none}
    ports:
      - "8080:8080"
    volumes:
      - docflow_uploads:/app/storage
      - ./incoming:/app/incoming
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /backend
        BACKEND_INTERNAL_URL: http://api:8080
    container_name: docflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /backend
      BACKEND_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  docflow_mysql_data:
  docflow_uploads:
